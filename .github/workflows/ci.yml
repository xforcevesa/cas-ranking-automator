name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run unit tests (no network)
      run: |
        SKIP_NETWORK_TESTS=1 python -m pytest tests/ -v --tb=short

    - name: Run network tests
      run: |
        python -m pytest tests/ -v --tb=short -k "TestScraperNetwork" || true
      timeout-minutes: 5

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        flake8 xr_scholar_scraper.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 xr_scholar_scraper.py tests/ --count --exit-zero --max-complexity=20 --max-line-length=120 --statistics
